name: Validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate HACS repository
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          comment: false

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate integration
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master

  quality:
    name: Code and workflow quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install lint tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: python -m ruff check .
      - name: Check Python formatting
        run: python -m ruff format --check .
      - name: Validate workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: "1.7.12"

  python:
    name: Python syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Compile integration
        run: python -m compileall -q custom_components
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  compatibility-matrix:
    name: Resolve Home Assistant versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Resolve minimum and latest stable runtimes
        id: versions
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re
          from urllib.request import urlopen

          minimum = json.loads(Path("hacs.json").read_text())["homeassistant"]
          targets = []
          for name, version in (
              ("minimum", minimum),
              ("latest", None),
          ):
              url = "https://pypi.org/pypi/homeassistant/"
              url += f"{version}/json" if version else "json"
              with urlopen(url, timeout=30) as response:
                  info = json.load(response)["info"]
              if not re.fullmatch(r"\d+\.\d+\.\d+", info["version"]):
                  raise ValueError(f"Expected a stable Home Assistant version: {info['version']}")
              python = re.search(r">=(\d+\.\d+)", info["requires_python"])
              if python is None:
                  raise ValueError(f"Cannot resolve Python requirement: {info['requires_python']}")
              targets.append({
                  "name": name,
                  "homeassistant": info["version"],
                  "python": python[1],
              })
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": targets}) + "\n")

  compatibility:
    name: Home Assistant (${{ matrix.name }})
    needs: compatibility-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compatibility-matrix.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up compatible Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install minimum Home Assistant test dependencies
        if: matrix.name == 'minimum'
        env:
          HA_VERSION: ${{ matrix.homeassistant }}
        run: >-
          python -m pip install
          "homeassistant==$HA_VERSION"
          "pytest-homeassistant-custom-component==0.13.305"
      - name: Install latest Home Assistant test dependencies
        if: matrix.name == 'latest'
        env:
          HA_VERSION: ${{ matrix.homeassistant }}
        run: >-
          python -m pip install -r requirements-test.txt
          "homeassistant==$HA_VERSION"
      - name: Run real Home Assistant tests
        run: python -m pytest tests/ha -v

  release:
    name: Publish release
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [hacs, hassfest, quality, python, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: publish-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release
        id: release
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          manifest = Path("custom_components/wled_holiday_lights/manifest.json")
          version = json.loads(manifest.read_text())["version"]
          pattern = r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
          if not re.fullmatch(pattern, version):
              raise ValueError(f"Expected a stable semantic version, got {version!r}")
          tag = f"v{version}"
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/") and ref != f"refs/tags/{tag}":
              raise ValueError(f"Release tag must be v{version}")

          def get_release(path):
              url = (
                  f"{os.environ['GITHUB_API_URL']}/repos/"
                  f"{os.environ['GITHUB_REPOSITORY']}/releases/{path}"
              )
              request = Request(url, headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with urlopen(request, timeout=30) as response:
                      return json.load(response)
              except HTTPError as error:
                  if error.code != 404:
                      raise
                  return None

          existing = get_release(f"tags/{tag}")
          if existing is not None:
              if existing["draft"] or existing["prerelease"]:
                  raise ValueError(f"{tag} already exists but is not a published stable release")
              print(f"{tag} is already published; no new release needed.")
          else:
              latest = get_release("latest")
              if latest is not None:
                  latest_version = latest["tag_name"].removeprefix("v")
                  if not re.fullmatch(pattern, latest_version):
                      raise ValueError(f"Cannot compare latest release version: {latest_version!r}")
                  if tuple(map(int, version.split("."))) <= tuple(map(int, latest_version.split("."))):
                      raise ValueError(f"{tag} must be newer than {latest['tag_name']}")

              tagged = subprocess.run(
                  ["git", "rev-parse", "--verify", "--quiet", f"refs/tags/{tag}^{{commit}}"],
                  capture_output=True, text=True,
              )
              if tagged.returncode not in (0, 1):
                  tagged.check_returncode()
              head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              if tagged.returncode == 0 and tagged.stdout.strip() != head:
                  raise ValueError(f"{tag} already points to a different commit")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"tag={tag}\npublish=true\n")
      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: >-
          gh release create "$RELEASE_TAG"
          --target "$RELEASE_SHA" --generate-notes --title "$RELEASE_TAG" --latest
